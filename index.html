    <!-- System-based theme-color for iOS status bar & Safari chrome (Signature Identity) -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#EEF3F8" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#070E1A" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Instant Theme Detector & WebSocket Error Suppressor -->
    <script>
      (function() {
        // Suppress benign WebSocket / Vite HMR disconnection errors in iframe environment
        window.addEventListener('unhandledrejection', function(event) {
          var reason = event && event.reason;
          var msg = reason && (reason.message || String(reason));
          if (
            msg && (
              msg.indexOf('WebSocket') !== -1 ||
              msg.indexOf('closed without opened') !== -1 ||
              msg.indexOf('@vite/client') !== -1
            )
          ) {
            event.preventDefault();
          }
        });

        function applyUserTheme() {
          var stored = localStorage.getItem('bttm_theme_mode');
          var isDark = stored ? stored === 'dark' : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var root = document.documentElement;
          if (isDark) {
            root.classList.add('dark');
            root.classList.remove('light');
          } else {
            root.classList.remove('dark');
            root.classList.add('light');
          }
        }
        applyUserTheme();
        if (window.matchMedia) {
          window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function() {
            if (!localStorage.getItem('bttm_theme_mode')) applyUserTheme();
          });
        }
      })();
    </script>
