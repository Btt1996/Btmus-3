<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="50%" stop-color="#09090b"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#8b5cf6" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="115" fill="url(#bg)"/>

  <!-- Subtle vinyl groove ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#27272a" stroke-width="2"/>
  <circle cx="256" cy="256" r="150" fill="none" stroke="#1f2937" stroke-width="1.5" stroke-dasharray="4 8"/>
  <circle cx="256" cy="256" r="110" fill="none" stroke="#27272a" stroke-width="2"/>

  <!-- Dynamic Equalizer / Soundwaves -->
  <g filter="url(#shadow)">
    <!-- Central Sound Waves / Music Note Motif -->
    <path d="M190 320 V 190 C 190 160 215 140 250 135 L 320 120 C 335 117 350 128 350 144 V 280" fill="none" stroke="url(#accent)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Left Note Head -->
    <ellipse cx="160" cy="330" rx="36" ry="26" transform="rotate(-20 160 330)" fill="url(#accent)"/>
    <!-- Right Note Head -->
    <ellipse cx="320" cy="290" rx="36" ry="26" transform="rotate(-20 320 290)" fill="url(#accent)"/>

    <!-- Wave bars on right -->
    <line x1="395" y1="210" x2="395" y2="290" stroke="url(#glow)" stroke-width="8" stroke-linecap="round"/>
    <line x1="415" y1="230" x2="415" y2="270" stroke="url(#glow)" stroke-width="8" stroke-linecap="round"/>
    <line x1="115" y1="225" x2="115" y2="275" stroke="url(#glow)" stroke-width="8" stroke-linecap="round"/>
    <line x1="95" y1="240" x2="95" y2="260" stroke="url(#glow)" stroke-width="8" stroke-linecap="round"/>
  </g>
</svg>
